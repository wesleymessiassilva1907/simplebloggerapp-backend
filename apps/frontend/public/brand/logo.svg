<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Vertix Logo - Icon + Wordmark -->
  <!-- Icon: Abstract V formed by converging lines representing multi-vertical -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- V Icon - geometric, modern -->
  <path d="M8 8L22 38L28 26L22 14L16 26L22 38L36 8" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="22" cy="38" r="3" fill="url(#grad2)"/>
  <circle cx="8" cy="8" r="2.5" fill="#6366F1"/>
  <circle cx="36" cy="8" r="2.5" fill="#8B5CF6"/>

  <!-- Wordmark -->
  <text x="52" y="34" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#1E1B4B">
    Vert<tspan fill="url(#grad1)">ix</tspan>
  </text>
</svg>
